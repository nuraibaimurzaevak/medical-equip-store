<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Изменение пароля</title>
  <link rel="stylesheet" href="changePassword.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Изменение пароля</h2>
      <form action="/update_password.php" method="post">

        <div class="form-group">
          <label for="current_password">Текущий пароль</label>
          <input type="password" id="current_password" name="current_password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="new_password">Новый пароль</label>
          <input type="password" id="new_password" name="new_password" placeholder="Новый пароль" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Подтвердите новый пароль</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите новый пароль" required>
        </div>

        <div class="form-group">
          <label for="verification_code">Код верификации</label>
          <input type="text" id="verification_code" name="verification_code" placeholder="Введите код из почты" required>
        </div>

        <div class="button-group">
          <button type="submit" class="btn save">Сохранить</button>
          <a href="/profile" class="btn cancel">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
